general {
    lock_cmd = hyprlock                                 # Lock command if system requests it
    #unlock_cmd = notify-send "Unlocked!"
    before_sleep_cmd = hyprlock                         # Before suspend
    #after_sleep_cmd = notify-send "Awake!"             # After resume
    ignore_dbus_inhibit = false                         # Respect apps that inhibit idle (e.g., Firefox, Brave)
    ignore_systemd_inhibit = false                      # Respect systemd idle inhibitors (e.g., media players)
}

# 🕒 After 2 minutes idle — notify
listener {
    timeout = 120
    on-timeout = notify-send "You've been idle for 2 minutes."
    #on-resume = notify-send "You're back!"
}

# 🔒 After 3 minutes idle — lock screen
listener {
    timeout = 180
    on-timeout = hyprlock
}

# 💤 After 5 minutes idle — suspend system
listener {
    timeout = 300
    on-timeout = systemctl suspend
}

