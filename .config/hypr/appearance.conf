# --- General Settings ---
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    
    animation = global, 1, 5, default
    animation = border, 1, 3, easeOutQuint
    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.2, linear, popin 87%
    animation = fadeIn, 1, 1.3, almostLinear
    animation = fadeOut, 1, 1.1, almostLinear
    animation = fade, 1, 2.2, quick
    animation = layers, 1, 2.5, easeOutQuint
    animation = layersIn, 1, 2.5, easeOutQuint, fade
    animation = layersOut, 1, 1.2, linear, fade
    animation = fadeLayersIn, 1, 1.2, almostLinear
    animation = fadeLayersOut, 1, 1.1, almostLinear
    animation = workspaces, 1, 1.5, almostLinear, fade
    animation = workspacesIn, 1, 1.0, almostLinear, fade
    animation = workspacesOut, 1, 1.5, almostLinear, fade

   }

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


