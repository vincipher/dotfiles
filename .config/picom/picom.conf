backend = "glx";  # or "xrender" if you have issues

vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -15;
shadow-offset-y = -15;

fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [ ];

blur-method = "dual_kawase";
blur-strength = 5;

corner-radius = 10;
