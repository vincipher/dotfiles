# ──────────── Volume Control ────────────
UP add volume 5                 # Volume up
DOWN add volume -5              # Volume down

# ────────────── Seeking ────────────────
LEFT seek -5                    # Seek backward 5 seconds
RIGHT seek 5                    # Seek forward 5 seconds
SHIFT+LEFT seek -30             # Seek backward 30 seconds
SHIFT+RIGHT seek 30             # Seek forward 30 seconds
Ctrl+LEFT seek -5 exact         # Exact seek backward
Ctrl+RIGHT seek 5 exact         # Exact seek forward

# ────────────── Playback ───────────────
SPACE cycle pause               # Play/pause toggle
p cycle pause                   # Play/pause alternative
. frame-step                    # Step forward one frame
, frame-back-step               # Step backward one frame
< cycle speed -0.1              # Decrease speed
> cycle speed 0.1               # Increase speed
BACKSPACE set speed 1.0         # Reset speed to normal

# ─────── Subtitle and Audio Control ───────
v cycle sub                     # Cycle subtitle tracks
b cycle audio                   # Cycle audio tracks
j cycle sub-delay -0.1          # Subtitle delay -100ms
l cycle sub-delay 0.1           # Subtitle delay +100ms
# (use j/l to sync subtitles)

# ────────────── Screen/Display ───────────────
f cycle fullscreen              # Toggle fullscreen
w cycle-values panscan 0 1      # Toggle zoom to fill screen
z add video-zoom 0.1            # Zoom in
x add video-zoom -0.1           # Zoom out

# ────────────── Playlist/Navigation ───────────────
n playlist-next                 # Next file in playlist
N playlist-prev                 # Previous file in playlist
ENTER loadfile expand-path-to-working-directory "${path}" append-play # Reopen current

# ────────────── Miscellaneous ───────────────
q quit                          # Quit player
ESC quit                        # Quit (alternative key)
i show-text "${filename}"       # Show file name
o show-progress                 # Show playback progress
TAB show-chapter                # Show current chapter
m cycle mute                    # Toggle mute

# ────────────── Screenshots ───────────────
s screenshot                    # Screenshot
S screenshot video              # Screenshot without subtitles
Ctrl+s screenshot window        # Screenshot full window

