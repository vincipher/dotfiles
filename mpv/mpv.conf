# ─────────────── Video Output ───────────────

vo=gpu                             # Use GPU rendering (OpenGL/Vulkan backend)
gpu-api=opengl                     # Use OpenGL (well supported on most Linux drivers)
# For AMD/Intel with good drivers: try gpu-api=vulkan

hwdec=auto                         # Auto-select the best available hardware decoder (VAAPI/NVDEC/etc)
# For more control, you can use:
# hwdec=vaapi    ← Intel/AMD
# hwdec=nvdec    ← NVIDIA

profile=fast                       # Use a fast built-in performance profile (less demanding, smoother)

scale=bilinear                     # Fastest image scaler (lowest GPU usage)
cscale=bilinear                    # Fastest chroma scaler

video-sync=display-resample        # Sync video to display refresh rate for smoother playback
interpolation=no                   # Disable frame interpolation (saves GPU)

# ─────────────── Performance Tweaks ───────────────

cache=yes                          # Enable caching for smoother playback
cache-secs=120                     # Cache 2 minutes ahead in memory
demuxer-max-bytes=512MiB           # Max file size MPV will demux in memory
demuxer-max-back-bytes=128MiB      # Allow some back-buffering

# ─────────────── Audio Settings ───────────────

volume=50                          # Default startup volume
mute=no                            # Start unmuted

# ─────────────── Subtitle Settings ───────────────

sub-auto=fuzzy                     # Auto-load subtitles with similar names
sub-font-size=30                   # Subtitle size
sub-color="#FFFFFF"                # White text
sub-border-color="#000000"         # Black outline
sub-shadow-color="#000000"         # Black shadow
sub-border-size=2.0                # Thickness of outline
sub-shadow-offset=1.0              # Shadow distance
sub-pos=100                         # Subtitle position (0 = bottom, 100 = top)
stretch-dvd-subs=yes               # Fix DVD subtitle distortion

# ─────────────── Playback Behavior ───────────────

loop-playlist=inf                  # Loop through entire playlist
keep-open=yes                      # Keep window open after playback
idle=once                          # Stay open after playback if started manually
pause=no                           # Start playing immediately
autoload-files=yes                 # Load files from same directory as playlist

# ─────────────── Screenshot Settings ───────────────

screenshot-format=png              # PNG format for high-quality screenshots
screenshot-directory=~/Pictures/mpv_screenshots  # Where screenshots are saved

# ─────────────── User Interface / OSD ───────────────

osc=yes                            # Enable on-screen controller
osd-bar=yes                        # Show progress bar
osd-level=1                        # Basic OSD (file name, time, etc.)
input-default-bindings=yes         # Retain MPV's built-in keybindings (use with input.conf)

